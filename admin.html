<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Site editor</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.5 Inter,system-ui,sans-serif;background:#12141a;color:#eee;display:flex;height:100vh}
aside{width:400px;flex:none;background:#0d0f13;border-right:1px solid #2a2d36;display:flex;flex-direction:column}
.top{padding:16px 18px;border-bottom:1px solid #2a2d36}.top h1{font-size:17px;margin:0}.top small{color:#9a9ea8}
.scroll{flex:1;overflow:auto;padding:10px 18px}
details{border-bottom:1px solid #22252d;padding:6px 0}summary{cursor:pointer;font-weight:600;padding:10px 0;list-style:none;display:flex;justify-content:space-between}
summary::after{content:"+";color:#ff2a3d}details[open] summary::after{content:"–"}
label{display:block;margin:10px 0 4px;font-size:12.5px;color:#9a9ea8}
label.chk{display:flex;gap:8px;align-items:center;color:#ddd;font-size:13px}
input[type=text],textarea,select{width:100%;padding:9px;border-radius:8px;border:1px solid #2f333d;background:#15171c;color:#eee;font:inherit}
textarea{min-height:76px;resize:vertical}input[type=color]{width:60px;height:34px;border:0;background:none;padding:0}
button{font:inherit;cursor:pointer;border:1px solid #2f333d;background:#1a1d24;color:#eee;padding:7px 11px;border-radius:8px}
button:hover{border-color:#ff2a3d}button.on{border-color:#ff2a3d;background:#2a0f14}button:disabled{opacity:.5}
.item{border:1px solid #2a2d36;border-radius:10px;padding:2px 12px 12px;margin:10px 0;background:#101218}
.item .bar{display:flex;gap:6px;justify-content:space-between;align-items:center;margin-top:10px}.item b{font-size:12.5px}
.img{display:flex;gap:8px;align-items:center}.img img{width:38px;height:38px;object-fit:contain;background:#000;border-radius:6px}
.foot{padding:14px 18px;border-top:1px solid #2a2d36;display:grid;gap:8px}
.save,.go{background:#ff2a3d;border-color:#ff2a3d;color:#fff;font-weight:600;padding:11px;width:100%}
.hint{color:#9a9ea8;font-size:12px}.row{display:flex;gap:8px}.row button{flex:1}
.step{background:#101218;border:1px solid #2a2d36;border-radius:10px;padding:10px 12px;margin:10px 0}.step h4{margin:0 0 4px;font-size:13px}
.vlist .v{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-top:1px solid #22252d}
.vlist code{color:#ff8a94;font-size:13px}
main{flex:1;display:flex;justify-content:center;padding:14px;overflow:auto}
iframe{border:0;background:#000;border-radius:12px;width:100%;transition:width .25s}iframe.m{width:390px}
@media(max-width:860px){body{flex-direction:column}aside{width:100%;height:58vh}main{height:42vh}}
</style></head><body>
<aside>
<div class="top"><h1>Site editor</h1><small>Edit on the left, preview on the right. Your work is kept in this browser.</small>
<div class="row" style="margin-top:10px"><button id="dt" class="on">Desktop</button><button id="mb">Mobile</button></div>
<div class="row" style="margin-top:8px" id="pg"></div></div>
<div class="scroll" id="form"></div>
<div class="foot"><button class="save" id="dl">Download content.js</button>
<div class="hint">Replace <b>content.js</b> in your site folder with this file, then re-upload it. (Client galleries are separate: see "Client galleries".)</div>
<button id="reset">Discard my edits</button></div>
</aside>
<main><iframe id="f" src="index.html" title="Preview"></iframe></main>
<script src="content.js"></script>
<script src="vault.js"></script>
<script>
const KEY='lm-draft-v2',$=id=>document.getElementById(id),f=$('f');
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||JSON.parse(JSON.stringify(window.SITE));
const CAT=(p)=>'select:'+p;
const SCHEMA=[
['Logo & name',[['brand.name','text','Site name (tab title)'],['brand.showName','bool','Show the name next to the logo'],['brand.title','text','Browser tab subtitle'],['brand.logo','image','Logo']]],
['Home: top',[['hero.headline','text','Headline'],['hero.accent','text','Words that glow (from the headline)'],['hero.sub','area','Intro text'],['hero.primary','text','Main button'],['hero.secondary','text','Second button'],['hero.image','image','Background photo (optional)'],['hero.video','text','Background video (optional, e.g. video/hero.mp4)']]],
['Home: scrolling strip',[['marquee','lines','One phrase per line']]],
['Home: about me',[['about.heading','text','Heading'],['about.paragraphs','paras','Text (blank line between paragraphs)'],['about.photo','image','Photo'],['about.skills','csv','Skills (separate with commas)']]],
['Home: what I do',[['home.services.heading','text','Heading'],['home.services.text','area','Intro'],['home.services.items','list','Service',[['title','text','Title'],['text','area','Description']]]]],
['Home: featured work',[['home.featured.heading','text','Heading'],['home.featured.text','area','Intro (shows your first 3 projects)']]],
['Home: how it works',[['home.steps.heading','text','Heading'],['home.steps.items','list','Step',[['title','text','Title'],['text','area','Description']]]]],
['Home: call to action',[['home.cta.heading','text','Heading'],['home.cta.text','area','Text'],['home.cta.button','text','Button']]],
['Projects',[['projects.heading','text','Heading'],['projects.text','area','Intro'],
  ['projects.categories','list','Category',[['name','text','Name'],['text','text','Short line (optional)'],['image','image','Tile image (optional)']]],
  ['projects.items','list','Project',[['category',CAT('projects.categories'),'Category'],['tag','text','Small label'],['title','text','Title'],['text','area','Description'],['image','image','Cover image'],['link','text','Link (optional)'],['linkLabel','text','Link text']]]]],
['Galleries',[['galleries.heading','text','Heading'],['galleries.text','area','Intro'],
  ['galleries.categories','list','Category',[['name','text','Name'],['text','text','Short line (optional)'],['image','image','Tile image (optional)']]],
  ['galleries.items','list','Gallery',[['category',CAT('galleries.categories'),'Category'],['title','text','Title'],['label','text','Small text'],['url','text','Link (only for galleries hosted elsewhere)'],['image','image','Thumbnail (optional)'],['locked','bool','Locked with a password'],['vault','text','Gallery ID (filled in automatically)']]]]],
['Contact & links',[['contact.heading','text','Heading'],['contact.text','area','Intro'],['contact.email','text','Email address'],['contact.types','lines','Project types in the form (one per line)'],['contact.socials','list','Social link',[['label','text','Name'],['url','text','Link']]]]],
['Colors',[['theme.accents.home','color','Home accent'],['theme.accents.projects','color','Projects accent'],['theme.accents.galleries','color','Galleries accent'],['theme.accents.contact','color','Contact accent'],['theme.bg','color','Background'],['theme.ink','color','Text']]],
['Footer',[['footer','text','Footer text']]]];
const walk=(o,p,make)=>{const k=p.split('.'),last=k.pop();for(const x of k){if(o[x]==null||typeof o[x]!=='object')o[x]={};o=o[x]}return[o,last]};
const get=p=>{let o=S;for(const x of p.split('.'))o=o&&o[x];return o};
let t;function push(){clearTimeout(t);t=setTimeout(()=>{localStorage.setItem(KEY,JSON.stringify(S));f.contentWindow&&f.contentWindow.postMessage({type:'site',data:S},'*')},200)}
f.onload=()=>f.contentWindow.postMessage({type:'site',data:S},'*');
const E=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
function shrink(file,key,cb){const i=new Image,u=URL.createObjectURL(file);i.onload=()=>{const m=key==='logo'?900:1800,s=Math.min(1,m/Math.max(i.width,i.height)),c=E('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(file.type==='image/png'?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.84))};i.src=u}
function field(obj,key,type,label){
 const w=E('div');let v=obj[key];const set=x=>{obj[key]=x;push()};
 if(type==='bool'){const l=E('label','chk'),i=E('input');i.type='checkbox';i.checked=!!v;i.onchange=()=>set(i.checked);l.append(i,document.createTextNode(label));return l}
 w.append(E('label','',label));
 if(type==='text'||type==='color'){const i=E('input');i.type=type;i.value=v||(type==='color'?'#ff2a3d':'');i.oninput=()=>set(i.value);w.append(i)}
 else if(type.startsWith('select:')){const s=E('select'),p=type.slice(7);
  const fill=()=>{s.textContent='';const names=(get(p)||[]).map(c=>c.name);if(obj[key]&&!names.includes(obj[key]))names.push(obj[key]);if(!obj[key]&&names.length)set(names[0]);
   names.forEach(n=>{const o=E('option','',n);o.value=n;s.append(o)});s.value=obj[key]||''};
  fill();s.onfocus=fill;s.onchange=()=>set(s.value);w.append(s)}
 else if(type==='image'){const r=E('div','img'),th=E('img'),i=E('input');i.type='text';i.value=(v||'').startsWith('data:')?'(uploaded photo)':v||'';i.placeholder='images/photo.jpg or upload →';
  if(v)th.src=v;else th.style.display='none';
  i.oninput=()=>{set(i.value);th.src=i.value;th.style.display=i.value?'':'none'};
  const b=E('button','','Upload'),fi=E('input');fi.type='file';fi.accept='image/*';fi.hidden=true;b.onclick=()=>fi.click();
  fi.onchange=()=>fi.files[0]&&shrink(fi.files[0],key,d=>{set(d);th.src=d;th.style.display='';i.value='(uploaded photo)'});
  r.append(th,i,b,fi);w.append(r)}
 else{const a=E('textarea');
  const to={area:x=>x||'',lines:x=>(x||[]).join('\n'),paras:x=>(x||[]).join('\n\n'),csv:x=>(x||[]).join(', ')}[type];
  const from={area:x=>x,lines:x=>x.split('\n').map(s=>s.trim()).filter(Boolean),paras:x=>x.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean),csv:x=>x.split(',').map(s=>s.trim()).filter(Boolean)}[type];
  a.value=to(v);a.oninput=()=>set(from(a.value));w.append(a)}
 return w}
function build(){
 const root=$('form');root.textContent='';root.append(clientPanel());
 SCHEMA.forEach(([title,fields])=>{
  const d=E('details');d.append(E('summary','',title));
  fields.forEach(([path,type,label,sub])=>{
   const[o,k]=walk(S,path);
   if(type!=='list'){d.append(field(o,k,type,label));return}
   if(!Array.isArray(o[k]))o[k]=[];const arr=o[k],box=E('div');
   const draw=()=>{box.textContent='';arr.forEach((it,i)=>{
     const c=E('div','item');sub.forEach(([sk,st,sl])=>c.append(field(it,sk,st,sl)));
     const bar=E('div','bar');bar.append(E('b','',label+' '+(i+1)));
     const up=E('button','','↑'),dn=E('button','','↓'),del=E('button','','Delete');
     up.onclick=()=>{if(i>0){[arr[i-1],arr[i]]=[arr[i],arr[i-1]];push();draw()}};
     dn.onclick=()=>{if(i<arr.length-1){[arr[i+1],arr[i]]=[arr[i],arr[i+1]];push();draw()}};
     del.onclick=()=>{if(confirm('Delete this item?')){arr.splice(i,1);push();draw()}};
     const g=E('div');g.style.cssText='display:flex;gap:6px';g.append(up,dn,del);bar.append(g);c.append(bar);box.append(c)})};
   draw();d.append(box);
   const add=E('button','','+ Add '+label.toLowerCase());add.style.marginTop='8px';
   add.onclick=()=>{const n={};sub.forEach(([sk])=>n[sk]='');arr.push(n);push();draw()};d.append(add)});
  root.append(d)})}

/* ---------- Add a gallery (locked or unlocked) ---------- */
const LS='lm-client-galleries';let lastMsg='';
const vlist=()=>{try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){return[]}};
function genPw(){const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(12));let s='';r.forEach((x,i)=>{s+=a[x%a.length];if(i%4===3&&i<11)s+='-'});return s}
async function prep(file,wm,text){
 const bm=await createImageBitmap(file),s=Math.min(1,2000/Math.max(bm.width,bm.height)),c=E('canvas');
 c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);const x=c.getContext('2d');x.drawImage(bm,0,0,c.width,c.height);
 if(wm){x.save();x.globalAlpha=.24;x.fillStyle='#fff';x.shadowColor='rgba(0,0,0,.6)';x.shadowBlur=4;const fs=Math.max(18,c.width/22);x.font='700 '+fs+'px Inter,sans-serif';x.rotate(-Math.PI/7);
  const step=fs*7;let row=0;for(let y=-c.width;y<c.height+c.width;y+=fs*4,row++)for(let xx=-c.width;xx<c.width*2;xx+=step)x.fillText(text,xx+(row%2)*step/2,y);x.restore()}
 const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.86));
 return{name:file.name.replace(/\.[^.]+$/,'')+'.jpg',type:'image/jpeg',bytes:new Uint8Array(await blob.arrayBuffer())}}
function clientPanel(){
 const d=E('details');d.open=true;d.append(E('summary','','Add a gallery (locked or unlocked)'));
 d.append(E('p','hint','Upload photos to make a gallery on your site. A locked gallery asks for its own password when someone clicks it, and its photos are encrypted on your computer before you upload them.'));
 const s1=E('div','step');s1.append(E('h4','','Step 1: Make it'));
 const name=E('input');name.type='text';name.placeholder='e.g. Gaels vs Carabins';
 const cat=E('select'),fillCat=()=>{cat.textContent='';((S.galleries&&S.galleries.categories)||[]).forEach(c=>{const o=E('option','',c.name);o.value=c.name;cat.append(o)})};fillCat();cat.onfocus=fillCat;
 const lk=E('input');lk.type='checkbox';lk.checked=true;const ll=E('label','chk');ll.append(lk,document.createTextNode('Lock this gallery with a password'));
 const pw=E('input');pw.type='text';pw.value=genPw();
 const nb=E('button','','New'),cb=E('button','','Copy');nb.onclick=()=>pw.value=genPw();cb.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(pw.value);cb.textContent='Copied';setTimeout(()=>cb.textContent='Copy',1200)};
 const pr=E('div','row');pr.append(pw,nb,cb);pw.style.flex='3';
 const pbox=E('div');pbox.append(E('label','','Password to give your client'),pr);lk.onchange=()=>pbox.hidden=!lk.checked;
 const wm=E('input');wm.type='checkbox';wm.checked=true;const wl=E('label','chk');wl.append(wm,document.createTextNode('Put a faint "'+(S.brand.name||'Lasher Media')+'" watermark on the photos'));
 const dc=E('input');dc.type='checkbox';const dl=E('label','chk');dl.append(dc,document.createTextNode('Let people download photos'));
 const fi=E('input');fi.type='file';fi.accept='image/*';fi.multiple=true;fi.hidden=true;const fb=E('button','','Choose photos');const fc=E('span','hint',' none chosen');
 fb.onclick=()=>fi.click();fi.onchange=()=>fc.textContent=' '+fi.files.length+' chosen';
 s1.append(E('label','','Gallery name (shown on the site)'),name,E('label','','Category'),cat,ll,pbox,wl,dl,E('label','','Photos'),fb,fc,fi);
 const s2=E('div','step');s2.append(E('h4','','Step 2: Download and upload'));
 const go=E('button','go','Create gallery'),st=E('div','hint');st.style.marginTop='8px';st.textContent=lastMsg;
 s2.append(go,st);d.append(s1,s2);
 const list=E('div','vlist');d.append(E('label','','Galleries you made here'),list);
 const draw=()=>{list.textContent='';const L=vlist();if(!L.length){list.append(E('div','hint','None yet.'));return}
  L.forEach((g,i)=>{const row=E('div','v'),info=E('div');info.append(E('div','',g.name+' ('+g.count+' photos, '+(g.locked?'locked':'unlocked')+')'));if(g.locked)info.append(E('code','',g.pw));
   const b=E('div','row');b.style.flex='none';
   if(g.locked){const msg=E('button','','Copy message');msg.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText('Hi! Your gallery is ready. Go to the Galleries page on my website, click "'+g.name+'", and enter this password: '+g.pw);msg.textContent='Copied';setTimeout(()=>msg.textContent='Copy message',1200)};b.append(msg)}
   const rm=E('button','','Remove');rm.onclick=()=>{if(confirm('Remove from this list? To take the gallery offline, also delete the folder '+(g.locked?'vault/':'gallery/')+g.id+' from your site and delete its card in the Galleries section.')){const n=vlist();n.splice(i,1);localStorage.setItem(LS,JSON.stringify(n));draw()}};
   b.append(rm);row.append(info,b);list.append(row)})};
 draw();
 go.onclick=async()=>{
  const files=[...fi.files],locked=lk.checked;
  if(!name.value.trim()||!files.length||!cat.value||(locked&&norm(pw.value).length<8)){st.textContent='Add a name, a category, at least one photo'+(locked?', and a password with 8+ characters':'')+'.';return}
  go.disabled=true;try{
   const out=[];for(let i=0;i<files.length;i++){st.textContent='Preparing photo '+(i+1)+' of '+files.length+'…';out.push(await prep(files[i],wm.checked,S.brand.name||'Lasher Media'))}
   st.textContent=locked?'Encrypting…':'Packaging…';
   const meta={title:name.value.trim(),allowDownload:dc.checked};
   const r=locked?await Vault.build(pw.value,meta,out):await Vault.buildOpen(meta,out);
   if(!S.galleries)S.galleries={};(S.galleries.items=S.galleries.items||[]).push({category:cat.value,title:meta.title,label:'',url:'',image:'',vault:r.id,locked});push();
   r.files['content.js']=new TextEncoder().encode('window.SITE = '+JSON.stringify(S,null,2)+';\n');
   const a=E('a');a.href=URL.createObjectURL(Vault.zip(r.files));a.download='gallery-'+r.id.slice(0,6)+'.zip';a.click();
   const L=vlist();L.push({name:meta.title,pw:locked?pw.value:'',id:r.id,count:out.length,locked});localStorage.setItem(LS,JSON.stringify(L));
   lastMsg='Done! Unzip the download over your site folder (say yes to replacing content.js), then upload everything. '+(locked?'Give your client the password shown below.':'');
   build();
  }catch(e){st.textContent='Something went wrong: '+e.message;go.disabled=false}};
 return d}
const norm=p=>Vault.norm(p);
build();
[['index.html','Home'],['projects.html','Projects'],['galleries.html','Galleries'],['contact.html','Contact']].forEach(([u,n],i)=>{const b=E('button',i?'':'on',n);b.onclick=()=>{f.src=u;[...$('pg').children].forEach(x=>x.classList.remove('on'));b.classList.add('on')};$('pg').append(b)});
$('dt').onclick=()=>{f.classList.remove('m');$('dt').classList.add('on');$('mb').classList.remove('on')};
$('mb').onclick=()=>{f.classList.add('m');$('mb').classList.add('on');$('dt').classList.remove('on')};
$('dl').onclick=()=>{const a=E('a');a.href=URL.createObjectURL(new Blob(['window.SITE = '+JSON.stringify(S,null,2)+';\n'],{type:'text/javascript'}));a.download='content.js';a.click()};
$('reset').onclick=()=>{if(confirm('Discard all your unsaved edits and go back to the published version?')){localStorage.removeItem(KEY);location.reload()}};
</script></body></html>
